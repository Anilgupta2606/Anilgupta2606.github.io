<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050d0b">
<title>Money Home</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230c2620'/%3E%3Cpath d='M16 42 L28 28 L36 35 L48 20' stroke='%23e2b04a' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
<style>
/* Money Home, in space: Cygnus at the centre, the apps in orbit around it, each one visited as you scroll.
   The scene is a night sky, so the page is dark in both themes. */
:root{
  color-scheme:dark;
  --space:#050d0b; --ink:#eef2ec; --ink2:#c3d0c8; --mut:#8fa59a; --line:rgb(255 255 255 / .1);
  --glass:rgb(9 22 18 / .58); --glass2:rgb(255 255 255 / .05);
  --gold:#e2b04a; --gold2:#f6d58a; --up:#5fe0a0; --dn:#ff8a73;
  --ats:#8b97ff; --exp:#f0a95c; --led:#5fb4f2; --trip:#4fd6c4;
  --a1:#5fb4f2; --a2:#4cc38a; --a3:#e2b04a; --a4:#f0a95c; --a5:#a98af0; --a6:#ef7aa4; --a7:#79b4be; --a8:#9aa39e;
  --display:'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --body:'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--space);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:inherit}
.up{color:var(--up)} .dn{color:var(--dn)}

/* ---------- the stage: one fixed canvas behind everything ---------- */
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.no3d #stage{display:none}
.no3d body, body.no3d{background:radial-gradient(900px 600px at 70% 30%, rgb(226 176 74 / .16), transparent 60%), radial-gradient(700px 500px at 20% 80%, rgb(79 214 196 / .1), transparent 60%), var(--space)}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgb(0 0 0 / .55))}
#tags{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 11px 6px 7px;border-radius:999px;
  background:rgb(5 14 11 / .55);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font:600 12.5px var(--body);white-space:nowrap;color:var(--ink);transition:opacity .25s;will-change:transform,opacity;text-decoration:none}
.tag i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.tag i svg{width:13px;height:13px}
.tag small{font:500 11.5px var(--mono);color:var(--mut)}
@media (max-width:560px){.tag small{display:none}.tag{font-size:11.5px;padding:4px 9px 4px 5px}.tag i{width:18px;height:18px}}
.tag.core{border-color:rgb(226 176 74 / .5);font:700 11px var(--display);letter-spacing:.32em;padding:5px 12px;color:var(--gold2)}

/* ---------- content, over the stage ---------- */
#app{position:relative;z-index:3}
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 14px;background:linear-gradient(180deg, rgb(5 13 11 / .75), transparent)}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--display);letter-spacing:.01em}
.brand svg{width:28px;height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgb(255 255 255 / .06);border:1px solid var(--line);font-size:12.5px;color:var(--ink);text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.chip.on i{background:var(--up);box-shadow:0 0 0 3px rgb(95 224 160 / .2)}
.chip.ai{font-weight:700;color:var(--gold2);border-color:rgb(226 176 74 / .35)}
@media (max-width:700px){.chips .hide-s{display:none}}

section.scene{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:110px 20px 70px;max-width:1240px;margin:0 auto}
section.scene.app{min-height:125vh;min-height:125svh}
@media (max-width:820px){
  section.scene{align-items:flex-end;padding:120px 16px 48px}
  section.scene.app{padding-top:46svh}
}

/* hero */
.hero{max-width:640px}
.kick{font:600 11.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.hero h1{font:800 clamp(40px,6.6vw,78px)/.98 var(--display);letter-spacing:-.035em;margin:14px 0 16px;
  background:linear-gradient(180deg,#fff, #cfdcd4 70%, #9bb3a7);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--ink2);font-size:16px;max-width:46ch;margin:0}
.glance{margin-top:24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:600px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);min-width:0;
  transition:border-color .2s, transform .2s, background .2s}
.tile:hover{border-color:color-mix(in srgb,var(--c,var(--gold)) 60%,transparent);transform:translateY(-2px);background:rgb(12 28 23 / .7)}
.tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tile .l{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .l i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.tile .v{font:600 19px/1.3 var(--mono);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.none{font:500 13px/1.9 var(--body);color:var(--ink2)}
.tile .s{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.big{grid-row:span 2;display:flex;flex-direction:column;justify-content:center;border-color:rgb(226 176 74 / .3);background:linear-gradient(160deg,rgb(226 176 74 / .12),var(--glass))}
.tile.big .v{font:800 clamp(26px,3.2vw,36px)/1.1 var(--display);letter-spacing:-.02em;color:var(--gold2)}
@media (max-width:560px){.hero p.lead{display:none}.glance{margin-top:18px;grid-template-columns:repeat(2,minmax(0,1fr))}.tile.big{grid-row:auto;grid-column:span 2}.hero h1{font-size:36px}}
.cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:8px;letter-spacing:.06em}
.cue b{width:1px;height:38px;background:linear-gradient(var(--gold),transparent);animation:drip 2.2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (max-width:820px){.cue{display:none}}

/* intro: the words arrive after the core has lit */
.rise{opacity:0;transform:translateY(18px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* app panels */
.panel{width:min(470px,100%);background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:24px;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 30px 80px -30px rgb(0 0 0 / .8), inset 0 1px 0 rgb(255 255 255 / .06);
  display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;
  opacity:.001;transform:translateY(40px) scale(.98);transition:opacity .7s, transform .9s cubic-bezier(.2,.7,.2,1)}
.panel.in{opacity:1;transform:none}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
.panel.wide{width:min(560px,100%)}
.phead{display:flex;align-items:center;gap:12px}
.glyph{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);flex:none;box-shadow:0 0 24px -4px color-mix(in srgb,var(--c) 60%,transparent)}
.glyph svg{width:22px;height:22px}
.phead .kick{color:var(--c)}
.phead h2{margin:2px 0 0;font:800 26px/1.1 var(--display);letter-spacing:-.02em}
.phead p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.status{margin-left:auto;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--glass2);color:var(--mut);white-space:nowrap;align-self:flex-start}
.status.live{background:rgb(95 224 160 / .12);color:var(--up)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.kv .l{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.kv .v{font:600 22px/1.25 var(--mono);font-variant-numeric:tabular-nums;margin-top:3px}
.kv .s{font-size:12px;color:var(--ink2)}
.meta{font-size:12px;color:var(--mut)}
.movers{display:flex;flex-wrap:wrap;gap:6px}
.mv{font-size:12px;padding:5px 9px;border-radius:8px;background:var(--glass2);color:var(--ink2)}
.mv b{font-family:var(--mono);font-weight:600}
.empty{font-size:13.5px;color:var(--ink2);background:var(--glass2);border-radius:14px;padding:13px 15px;line-height:1.5}
.opens{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.open{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--c);color:#06100d;text-decoration:none;font-weight:700;font-size:13.5px;border:0;cursor:pointer;font-family:var(--body);
  box-shadow:0 8px 30px -10px var(--c);transition:transform .15s, box-shadow .15s}
.open:hover{transform:translateY(-1px);box-shadow:0 12px 34px -8px var(--c)}
.open.alt{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.opens .edit{background:none;border:0;color:var(--ink2);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:4px}
.open:focus-visible,.chip:focus-visible,.tag:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sep{height:1px;background:var(--line);margin:2px 0}
.sub-h{font-size:12px;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}

.flow{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--glass2)}
.flow i{display:flex;align-items:center;padding-inline:9px;color:#06100d;font:600 11.5px var(--mono);white-space:nowrap;overflow:hidden;min-width:0;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.flowkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.flowkey span{display:inline-flex;gap:6px;align-items:center}
.flowkey em{width:9px;height:9px;border-radius:3px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:120px}
.bars .col{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.bars .stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:7px 7px 3px 3px;overflow:hidden;transform-origin:bottom;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.panel:not(.in) .bars .stack{transform:scaleY(0)}
.bars .stack i{display:block}
.bars .m{font-size:10.5px;color:var(--mut)}
.track{height:8px;border-radius:6px;background:var(--glass2);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--led),#7fd3b5)}

.ringrow{display:flex;align-items:center;gap:18px}
.ring{width:128px;height:128px;flex:none}
.ring .arc{transition:stroke-dasharray 1.6s cubic-bezier(.2,.7,.2,1)}
.ringfacts{display:flex;flex-direction:column;gap:10px}
.rf .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.rf .v{font:600 17px var(--mono)}
.ribbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--glass2)}
.ribbar i{display:block;height:100%}
.ribbar i + i{border-left:2px solid rgb(5 13 11 / .8)}
.riblegend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:12px;color:var(--mut)}
.riblegend span{display:inline-flex;align-items:center;gap:6px}
.riblegend b{color:var(--ink);font:500 12px var(--mono)}
.riblegend em{width:9px;height:9px;border-radius:3px;display:inline-block}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0;padding-top:0}
.when{grid-row:span 2;font:600 11px/1.2 var(--mono);color:var(--mut);background:var(--glass2);border-radius:8px;padding:5px 7px;text-align:center;min-width:54px}
.when b{display:block;font-size:14px;color:var(--ink)}
.todo .a{font-weight:600;font-size:13.5px}
.todo .f{font-size:12px;color:var(--mut)}
.pr{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.countdown{display:flex;align-items:baseline;gap:8px}
.countdown b{font:800 54px/1 var(--display);letter-spacing:-.03em;color:var(--c)}
.route{display:flex;flex-direction:column;gap:6px}
.leg{display:flex;align-items:center;gap:10px;font:500 12.5px var(--mono);color:var(--ink2);padding:8px 11px;border-radius:10px;background:var(--glass2)}
.leg .path{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 8px);position:relative}
.leg .path::after{content:"✈";position:absolute;top:-9px;left:0;font-size:12px;color:var(--c);animation:fly 3.5s linear infinite}
@keyframes fly{to{left:calc(100% - 10px)}}

/* Ask, at the core */
.askwrap{width:min(560px,100%)}
.ask{display:flex;flex-direction:column;gap:12px}
.ask .cap{margin:0;font-size:12.5px;color:var(--mut)}
.ask form{display:flex;gap:8px}
.ask textarea{flex:1;min-width:0;resize:vertical;min-height:50px;font:15px/1.45 var(--body);color:var(--ink);background:rgb(0 0 0 / .3);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.ask textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.ask button.go{border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;font:800 14px var(--body);padding:0 20px;cursor:pointer;box-shadow:0 10px 30px -10px var(--gold)}
.ask button.go:disabled{opacity:.6}
.ask .hub{font-size:12px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;align-self:flex-start}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{font:500 12.5px var(--body);border:1px solid var(--line);background:var(--glass2);color:var(--ink2);border-radius:999px;padding:6px 11px;cursor:pointer}
.sugg button:hover{color:var(--ink);border-color:var(--gold)}
.convo{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto}
.convo .q{align-self:flex-end;background:rgb(255 255 255 / .08);border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:85%;font-weight:600;font-size:14px}
.convo .a{background:rgb(226 176 74 / .08);border:1px solid rgb(226 176 74 / .2);border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.convo .by{display:block;margin-top:6px;font-size:11.5px;color:var(--mut)}
.convo .srcs{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px}
.convo .srcs a{color:inherit;opacity:.8}
.convo .err{color:var(--dn)}
@media (max-width:600px){.ask form{flex-direction:column}.ask button.go{padding:13px}}
.foot{max-width:1240px;margin:0 auto;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mut);position:relative;z-index:3}
.btn{font:600 12.5px var(--body);border:1px solid var(--line);background:var(--glass);color:var(--ink2);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn:hover{color:var(--ink)}
.demo{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);z-index:12;font:600 11.5px var(--mono);letter-spacing:.08em;padding:6px 12px;border-radius:999px;background:rgb(226 176 74 / .15);border:1px solid rgb(226 176 74 / .4);color:var(--gold2)}

/* the rail: where you are in the system */
.rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:11;display:flex;flex-direction:column;gap:14px}
.rail a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;color:var(--mut);font-size:12px}
.rail a span{opacity:0;transform:translateX(6px);transition:.25s}
.rail a:hover span,.rail a.on span{opacity:1;transform:none}
.rail a b{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c);transition:.25s}
.rail a.on b{background:var(--c);box-shadow:0 0 12px var(--c);transform:scale(1.25)}
.rail a.on{color:var(--ink)}
@media (max-width:820px){.rail{right:8px;gap:12px}.rail a span{display:none}}
@media (max-width:560px){.rail{display:none}}

/* sign-in, over the running scene */
.gate{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 16px;position:relative;z-index:3}
.gate form{width:min(380px,100%);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:28px 26px;display:flex;flex-direction:column;gap:8px;box-shadow:0 30px 80px -20px rgb(0 0 0 / .7)}
.gate h1{font:800 28px/1.1 var(--display);margin:6px 0 4px;letter-spacing:-.02em}
.gate .sub{color:var(--mut);font-size:13.5px;margin:0 0 10px}
.gate label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-top:6px}
.gate input{padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:rgb(0 0 0 / .3);color:var(--ink);font:15px var(--body)}
.gate input:focus{outline:none;border-color:var(--gold)}
.gate button{margin-top:12px;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;font:800 14.5px var(--body);cursor:pointer}
.gate .err{color:var(--dn);font-size:13px}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rise,.panel{opacity:1;transform:none}
}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div id="tags" aria-hidden="true"></div>
<div id="app"></div>
<script src="/ai/ai.js"></script>
<script src="/ai/brain.js"></script>
<script src="/ai/ask.js"></script>
<script src="/ai/web.js"></script>
<script src="/InvestmentPlan/cloud.js"></script>
<script type="module">
"use strict";
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => (n < 0 ? '−' : '') + '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN');
const cr = n => { const a = Math.abs(n), s = n < 0 ? '−' : ''; return a >= 1e7 ? s + '₹' + (a / 1e7).toFixed(2) + ' Cr' : a >= 1e5 ? s + '₹' + (a / 1e5).toFixed(2) + ' L' : inr(n); };

function month(txns, m){
  const a = {spend:0, refunds:0, invested:0, redeemed:0, income:0};
  txns.forEach(t => { if(!t.date.startsWith(m) || t.excluded || t.kind === 'ignore') return; const out = t.direction === 'debit';
    if(t.kind === 'spend'){ if(out) a.spend += t.amount; else a.refunds += t.amount; }
    else if(t.kind === 'investment'){ if(out) a.invested += t.amount; else a.redeemed += t.amount; }
    else if(t.kind === 'cc_bill'){ if(out && !t.paired) a.spend += t.amount; }
    else if(t.kind === 'income' && !out) a.income += t.amount; });
  a.spend -= a.refunds;
  return a;
}
function market(){
  const ist = new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000);
  const d = ist.getDay(), mins = ist.getHours() * 60 + ist.getMinutes();
  if(d === 0 || d === 6) return {on:false, text:'NSE closed · weekend'};
  if(mins < 555) return {on:false, text:'NSE opens 09:15'};
  if(mins < 930) return {on:true, text:'NSE open · closes 15:30'};
  return {on:false, text:'NSE closed · opens 09:15'};
}
async function tripVault(){
  if(DEMO) return DEMO_DATA.tv;

    if(!window.indexedDB) return null;
    if(indexedDB.databases && !(await indexedDB.databases()).some(d => d.name === 'trip-vault')) return null;
    const db = await new Promise((res, rej) => { const r = indexedDB.open('trip-vault'); r.onupgradeneeded = () => { try{ r.transaction.abort(); }catch(e){} }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    try{
      if(!db.objectStoreNames.contains('kv')) return null;
      return await new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get('state'); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
    } finally { db.close(); }
  }catch(e){ return null; }
}

  const ctx = [];

    ctx.push(`16-Year Ledger (investment plan): net worth ${cr(netWorth)}; retirement corpus ${cr(corpus)}${tHi ? ` against a target of ₹${tLo ? tLo + '–' : ''}${tHi} Cr` : ''}${yearsLeft !== null ? `; ${yearsLeft.toFixed(1)} years to retirement at ${retire}` : ''}; monthly SIPs ${inr(sip)}.`);
    if(allocList.length) ctx.push('Holdings by type: ' + allocList.slice(0, 10).map(([k, v]) => k + ' ' + cr(v)).join(', ') + '.');
    const open = (plan.calendar || []).filter(c => !c.done).sort((a, b) => (a.year - b.year) || (a.age - b.age)).slice(0, 5);
    if(open.length) ctx.push('Next on the plan: ' + open.map(c => c.year + ': ' + c.action + (c.fund ? ' (' + c.fund + ')' : '')).join('; ') + '.');
  }
  if(atsOk) ctx.push(`ATS live holdings: ${Object.entries(T).filter(([, v]) => typeof v === 'number').map(([k, v]) => k.replace(/_/g, ' ') + ' ' + (Math.abs(v) > 1000 ? cr(v) : v)).join(', ')}.`);
  if(et && et.txns && et.txns.length){
    const last = et.txns.map(t => t.date).sort().slice(-1)[0].slice(0, 7);
    ctx.push('Expense Tracker, by month (spent / income / invested): ' + [0, -1, -2, -3, -4, -5].map(k => { const m = shiftM(last, k), A = month(et.txns, m); return ymLabel(m, 'short') + ' ' + inr(A.spend) + ' / ' + inr(A.income) + ' / ' + inr(A.invested); }).join('; ') + '.');
    const byCat = {}; et.txns.forEach(t => { if(t.date.startsWith(last) && t.kind === 'spend' && t.direction === 'debit' && !t.excluded) byCat[t.category || 'Other'] = (byCat[t.category || 'Other'] || 0) + t.amount; });
    const top = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 8);
    if(top.length) ctx.push('Spending by category in ' + ymLabel(last, 'short') + ': ' + top.map(([k, v]) => k + ' ' + inr(v)).join(', ') + '.');
  }
  if(tv && (tv.trips || []).length){
    const today = new Date().toISOString().slice(0, 10);
    const trips = tv.trips.map(t => { const docs = (tv.docs || []).filter(d => d.tripId === t.id && isTripDoc(d));
      const fl = [].concat(...docs.map(d => ((d.fields || {}).segments || []))).filter(x => x.flight).map(x => `${x.flight} ${x.from}→${x.to} ${x.date || ''} ${x.dep || ''}`.trim());
      const hotels = docs.filter(d => d.type === 'hotel').map(d => (d.fields || {}).hotelName || d.title);
      return {t, fl, hotels, n: docs.length}; }).filter(x => !x.t.end || x.t.end >= today).slice(0, 4);
    if(trips.length) ctx.push('Trip Vault, upcoming trips: ' + trips.map(x => `${x.t.name} (${[x.t.city, x.t.start && x.t.start + ' to ' + (x.t.end || '?')].filter(Boolean).join(', ')}; ${x.n} documents${x.fl.length ? '; flights ' + x.fl.join(', ') : ''}${x.hotels.length ? '; staying at ' + x.hotels.join(', ') : ''})`).join('; ') + '.');
  }
  const pdocs = personalDocs(tv);
  if(pdocs.length) ctx.push('Personal documents in Trip Vault (no numbers shown): ' + pdocs.map(d => (DOC_LABEL[d.type] || d.type) + (d.person ? ' of ' + d.person : '') + (d.fields && d.fields.validUntil ? ', valid until ' + d.fields.validUntil : '') + (d.fields && d.fields.issuedOn ? ', issued ' + d.fields.issuedOn : '')).join('; ') + '.');
  ASK.ctx = ctx.join('\n');
  ASK.data = {today: new Date().toISOString().slice(0, 10), txns: (et && et.txns) || [],
    ledger: real ? {netWorth, corpus, targetLow: tLo, targetHigh: tHi, retire, yearsLeft, sip} : null,
    trips: ((tv && tv.trips) || []).map(t => ({name: t.name, city: t.city, start: t.start, end: t.end})).filter(t => t.start),
    docs: ((tv && tv.docs) || []).filter(d => d.fields && d.fields.validUntil).map(d => ({type: d.type, label: DOC_LABEL[d.type] || d.title || d.type, person: d.person, validUntil: d.fields.validUntil}))};
  if(!DEMO) try{ localStorage.setItem('money-apps-snapshot', JSON.stringify({at: new Date().toISOString(), ctx: ASK.ctx, data: ASK.data})); }catch(e){}

  /* ----- what each world says, in orbit */
  const tagNote = {}, G = {};

  /* ===== ATS */
  let atsBody;
  if(atsOk){
    const movers = (ats.items || []).filter(r => r.pct != null && r.value > 0).sort((a, b) => b.pct - a.pct);
    const lbl = r => String(r.symbol || r.name || '').replace(/\.NS$|\.BO$|-USD$/, '').slice(0, 14) || r.name;
    atsBody = `<div class="kv">
      <div><div class="l">Holdings now</div><div class="v">${cr(T.value || 0)}</div><div class="s">invested ${cr(T.invested || 0)}</div></div>
      <div><div class="l">Total gain</div><div class="v ${(T.gain || 0) >= 0 ? 'up' : 'dn'}">${(T.gain || 0) >= 0 ? '+' : ''}${cr(T.gain || 0)}</div><div class="s">${T.gain_pct != null ? pct(T.gain_pct) : ''}</div></div>
      <div><div class="l">Today</div><div class="v ${(T.day || 0) >= 0 ? 'up' : 'dn'}">${(T.day || 0) >= 0 ? '+' : ''}${inr(T.day || 0)}</div><div class="s">${T.day_pct != null ? pct(T.day_pct) : ''}</div></div>
      <div><div class="l">Market</div><div class="v" style="font-size:15px;padding-top:5px">${esc(mk.text)}</div></div></div>
      ${movers.length ? `<div class="movers">${movers.slice(0, 2).map(r => `<span class="mv">▲ ${esc(lbl(r))} <b class="up">${pct(r.pct)}</b></span>`).join('')}${movers.slice(-2).reverse().filter(r => r.pct < 0).map(r => `<span class="mv">▼ ${esc(lbl(r))} <b class="dn">${pct(r.pct)}</b></span>`).join('')}</div>` : ''}
      <div class="meta">Brokers synced ${ats.updated_at ? esc(new Date(ats.updated_at).toLocaleString('en-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hour12:false})) : '—'} · ${esc(ats.source || '')}</div>`;
    G.ats = {v: ((T.day || 0) >= 0 ? '+' : '') + inr(T.day || 0), cls: (T.day || 0) >= 0 ? 'up' : 'dn', s: (T.day_pct != null ? pct(T.day_pct) + ' · ' : '') + 'holdings ' + cr(T.value || 0)};
    tagNote.ats = (T.day || 0) >= 0 ? '+' + kfmt(T.day || 0) + ' today' : '−' + kfmt(-(T.day || 0)) + ' today';
  } else if(atsChecking){
    atsBody = `<div class="empty">Asking ATS on this Mac for today’s numbers…</div>`; tagNote.ats = 'checking…';
  } else {
    atsBody = `<div class="empty">${!(HAS_CLOUD && Cloud.atsLink()) ? 'Link ATS once from the Ledger (Import portfolio → Link ATS on this Mac) and your holdings show here, live.'
      : 'ATS isn’t reachable from this device. It runs on your Mac, which must be on (from your phone: through Tailscale, linked with ATS → Holdings → Link this device).'}${real && plan.atsReadAt ? ` The Ledger last read it ${esc(ago(new Date(plan.atsReadAt).getTime()))}.` : ''}</div>`;
    tagNote.ats = 'offline';
  }
  function atsButtons(){
    const remote = atsRemote(), local = LINKS.ats;
    const mac = `<a class="open${MOBILE ? ' alt' : ''}" href="${esc(MOBILE ? local : atsUrl())}" target="_blank" rel="noopener" title="ATS on the Mac it runs on">Open ATS · this Mac <span aria-hidden="true">→</span></a>`;
    const away = remote
      ? `<a class="open${MOBILE ? '' : ' alt'}" href="${esc(remote + '/')}" target="_blank" rel="noopener" title="${esc(remote)} - through Tailscale (it must be on, on this device)">Open ATS · Remote <span aria-hidden="true">→</span></a><button class="edit" id="atsRemoteEdit" type="button">change</button>`
      : `<button class="open alt" id="atsRemoteEdit" type="button" title="Your Mac's Tailscale address, to open ATS from your phone">＋ Remote address</button>`;
    return `<div class="opens">${MOBILE ? away + mac : mac + away}</div>`;
  }

  /* ===== Expense Tracker */
  const txns = et && et.txns || [];
  let expBody;
  if(txns.length){
    const lastDate = txns.reduce((m, t) => t.date > m ? t.date : m, '');

    const d = B.spend ? (A.spend / B.spend - 1) * 100 : null;

    const seg = (v, c, t, i) => v > 0 ? `<i style="width:${(v / tot * 100).toFixed(2)}%;background:${c};animation-delay:${.15 * i}s" title="${t} ${inr(v)}">${v / tot > .14 ? kfmt(v) : ''}</i>` : '';

          <span class="m">${esc(ymLabel(h.m, 'short'))}</span></div>`).join('')}</div></div>
      <div class="meta">Statements up to ${esc(new Date(lastDate).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}))}</div>`;
    G.exp = {l: 'Spent · ' + ymLabel(lastM, 'short'), v: inr(A.spend), s: d == null ? 'this month' : `<span class="${d > 0 ? 'dn' : 'up'}">${pct(d, 0)}</span> vs last month`};

    const todo = (plan.calendar || []).filter(c => !c.done).sort((a, b) => (a.year - b.year) || (a.age - b.age)).slice(0, 3);
    ledBody = `${tHi ? `<div class="ringrow">${ringSvg(corpus / (tHi * 1e7))}<div class="ringfacts">
        <div class="rf"><div class="l">Corpus</div><div class="v">${cr(corpus)}</div></div>
        <div class="rf"><div class="l">Target</div><div class="v">₹${esc(tLo)}–${esc(tHi)} Cr</div></div>
        <div class="rf"><div class="l">Retire at</div><div class="v">${esc(retire)}${yearsLeft != null ? ` <span style="font-size:12px;color:var(--mut)">· ${yearsLeft.toFixed(1)} yrs</span>` : ''}</div></div></div></div>` : ''}
      <div class="kv">
        <div><div class="l">Since the start</div><div class="v ${last && first && last.value >= first.value ? 'up' : ''}">${last && first ? (last.value >= first.value ? '+' : '') + cr(last.value - first.value) : '—'}</div><div class="s">${first ? 'from ' + esc(new Date(first.date).toLocaleDateString('en-IN', {month:'short', year:'numeric'})) : ''}</div></div>
        <div><div class="l">Monthly SIP</div><div class="v">${inr(sip)}</div><div class="s">${plan.atsReadAt ? 'holdings read ' + esc(ago(new Date(plan.atsReadAt).getTime())) : 'as last imported'}</div></div></div>
      ${allocTop.length ? `<div><div class="ribbar" role="img" aria-label="Where the money is">${allocTop.map(([k, v], i) => `<i style="width:${(v / netWorth * 100).toFixed(2)}%;background:var(${PAL[i % PAL.length]})" title="${esc(k)} ${cr(v)}"></i>`).join('')}</div>
        <div class="riblegend">${allocTop.map(([k, v], i) => `<span><em style="background:var(${PAL[i % PAL.length]})"></em>${esc(k)} <b>${cr(v)}</b></span>`).join('')}</div></div>` : ''}
      ${todo.length ? `<div class="sep"></div><div><div class="sub-h"><span>Next on your plan</span></div><ul class="todo">${todo.map(c => `<li><span class="when"><b>${esc(c.year)}</b>age ${esc(c.age)}</span>
          <span class="a"><span class="pr" style="background:${PRC[c.pr] || 'var(--mut)'}"></span>${esc(c.action)}</span><span class="f">${esc(c.fund || '')}${c.why ? (c.fund ? ' — ' : '') + esc(c.why) : ''}</span></li>`).join('')}</ul></div>` : ''}`;
    G.led = tHi ? {v: (corpus / (tHi * 1e7) * 100).toFixed(1) + '%', s: cr(corpus) + ' of ₹' + tHi + ' Cr'} : {v: cr(corpus), s: 'retirement corpus'};
    tagNote.led = tHi ? (corpus / (tHi * 1e7) * 100).toFixed(1) + '% of target' : cr(corpus);
  } else {
    ledBody = `<div class="empty">No plan in this browser yet. Open the Ledger and restore or sync your plan.</div>`; tagNote.led = 'no plan yet';
  }

  /* ===== Trip Vault */
  let tripBody;
  const today = new Date().toISOString().slice(0, 10);
  if(tv && (tv.trips || []).length){
    const span = t => { const ds = []; (tv.docs || []).filter(d => d.tripId === t.id && isTripDoc(d)).forEach(d => { const f = d.fields || {};
      (f.segments || []).forEach(x => x.date && ds.push(x.date)); ['checkIn', 'checkOut', 'date'].forEach(k => /^\d{4}-\d{2}-\d{2}$/.test(f[k] || '') && ds.push(f[k])); });
      ds.sort(); return {start: t.start || ds[0] || '', end: t.end || ds[ds.length - 1] || ''}; };
    const trips = tv.trips.map(t => Object.assign({}, t, span(t)));
    const next = trips.filter(t => !t.end || t.end >= today).sort((a, b) => String(a.start || '9').localeCompare(String(b.start || '9')))[0];
    const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-IN', {day: 'numeric', month: 'short'}) : '';
    if(next){
      const days = next.start ? Math.round((Date.parse(next.start + 'T00:00:00') - Date.parse(today + 'T00:00:00')) / 86400000) : null;
      const docs = (tv.docs || []).filter(d => d.tripId === next.id && isTripDoc(d));
      const legs = [].concat(...docs.map(d => ((d.fields || {}).segments || []))).filter(x => x.from && x.to);
      const hotels = docs.filter(d => d.type === 'hotel').map(d => (d.fields || {}).hotelName || d.title).filter(Boolean);
      tripBody = `<div><div class="l" style="font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)">Next trip</div>

          <div class="meta" style="color:var(--ink2)">${esc([next.city, fmt(next.start) + (next.end && next.end !== next.start ? ' – ' + fmt(next.end) : '')].filter(Boolean).join(' · '))}</div></div>
        <div class="countdown">${days === null ? '<span class="meta">No dates yet</span>' : days > 0 ? `<b class="num">${days}</b><span>day${days === 1 ? '' : 's'} to go</span>` : '<b>Now</b><span>on the trip</span>'}</div>
        ${legs.length ? `<div class="route">${legs.slice(0, 3).map(x => `<div class="leg"><span>${esc(x.from)}</span><span class="path"></span><span>${esc(x.to)}</span><span style="color:var(--mut)">${esc(x.flight || '')} ${esc(fmt(x.date))}</span></div>`).join('')}</div>` : ''}
        <div class="meta">${docs.length} document${docs.length === 1 ? '' : 's'} · ${legs.length} flight${legs.length === 1 ? '' : 's'}${hotels.length ? ' · ' + esc(hotels[0]) : ''}${pdocs.length ? ` · ${pdocs.length} personal document${pdocs.length === 1 ? '' : 's'} in the vault` : ''}</div>`;
      G.trip = {v: days === null ? esc(next.name) : days > 0 ? days + ' day' + (days === 1 ? '' : 's') : 'Now', s: esc(next.city || next.name) + (next.start ? ' · ' + fmt(next.start) : '')};
      tagNote.trip = days === null ? next.name : days > 0 ? next.city + ' in ' + days + 'd' : 'on a trip';
    } else { tripBody = `<div class="empty">No upcoming trips. ${trips.length} past trip${trips.length === 1 ? '' : 's'} in Trip Vault.</div>`; tagNote.trip = 'no trips ahead'; }
  } else {
    tripBody = `<div class="empty">Tickets, hotel bookings, itineraries, news and flight status for your trips. Open Trip Vault to add the first one.</div>`; tagNote.trip = 'add a trip';
  }

  const panel = (k, n, name, sub, status, body, cta, wide) => `<section class="scene app" id="s-${k}" data-scene="${k}"><div class="panel${wide ? ' wide' : ''}" style="--c:var(--${k})">
    <div class="phead"><span class="glyph">${ICON[k]}</span><div><div class="kick">${n} · powered by Cygnus</div><h2>${name}</h2><p>${sub}</p></div>${status}</div>${body}
    ${k === 'ats' ? atsButtons() : `<div class="opens"><a class="open" href="${esc(LINKS[k])}">${cta} <span aria-hidden="true">→</span></a></div>`}</div></section>`;

  /* a tile on the first screen: the app's one number; a tap flies to the app */
  const tile = (k, label, g, none) => `<button type="button" class="tile" data-go="${k}" style="--c:var(--${k})"><div class="l"><i></i>${esc(g && g.l || label)}</div>
    <div class="v ${g && g.cls || ''}${g ? '' : ' none'}">${g ? g.v : esc(none)}</div><div class="s">${g ? g.s : '&nbsp;'}</div></button>`;
  const live = [atsOk, txns.length > 0, real, !!(tv && (tv.trips || []).length)].filter(Boolean).length;
  const first = !document.querySelector('.hero');
  const rise = d => first ? ` class="rise" style="animation-delay:${CALM ? 0 : SEEN ? (d - 1.6) * .4 : d}s"` : '';
  $('app').innerHTML = `<header class="top"><div class="brand">${logo()}Money Home</div>
      <div class="chips"><span class="chip ${mk.on ? 'on' : ''} hide-s"><i></i>${esc(mk.text)}</span>
        <a class="chip ai" href="/ai/chat/" target="_blank" title="Cygnus AI in this browser — works anywhere, even with the Mac off">✦ Cygnus AI ↗</a>
        <a class="chip hide-s" href="https://anils-macbook-air.tail4a1c2d.ts.net:8443/" target="_blank" rel="noopener" title="The full Cygnus AI on your Mac, through Tailscale">💻 On Mac ↗</a>
        <a class="chip" href="/setup/">⚙</a></div></header>
    <nav class="rail" aria-label="Sections">${[['core', 'Cygnus', 'var(--gold)'], ['ats', 'ATS', 'var(--ats)'], ['exp', 'Expenses', 'var(--exp)'], ['led', 'Ledger', 'var(--led)'], ['trip', 'Trips', 'var(--trip)'], ['ask', 'Ask Cygnus', 'var(--gold2)']]
      .map(([k, n, c]) => `<a href="#s-${k}" data-k="${k}" style="--c:${c}"><span>${n}</span><b></b></a>`).join('')}</nav>
    <section class="scene" id="s-core" data-scene="core" style="position:relative"><div class="hero">
      <div${rise(1.6)}><span class="kick">${esc(hello)} · ${esc(new Date().toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'}))}</span></div>
      <h1${rise(1.8)}>One core.<br><em>Every rupee</em> in orbit.</h1>
      <p class="lead"${rise(2.0)}>Cygnus sits at the centre — your keys, your data, your AI — and powers each app around it. ${live} of 4 are reporting in.</p>
      <div class="glance"${rise(2.3)}>
        <button type="button" class="tile big" data-go="led"><div class="l">Net worth</div><div class="v">${netWorth ? cr(netWorth) : '—'}</div><div class="s">${netWorth ? 'corpus ' + cr(corpus) : 'open the Ledger once here'}</div></button>
        ${tile('ats', 'Today · ATS', G.ats, atsChecking ? 'checking…' : 'offline')}
        ${tile('exp', 'Spent', G.exp, 'no statements yet')}
        ${tile('led', 'Of your target', G.led, 'no plan yet')}
        ${tile('trip', 'Next trip', G.trip, 'none planned')}
      </div>
    </div><div class="cue"><span>Scroll to follow the light</span><b></b></div></section>
    ${panel('ats', '01', 'ATS', 'Trading dashboard · your Mac', atsOk ? '<span class="status live">live</span>' : atsChecking ? '<span class="status">checking</span>' : '<span class="status">offline</span>', atsBody, 'Open ATS')}
    ${panel('exp', '02', 'Expense Tracker', 'Spending from your statements', '', expBody, 'Open Expense Tracker', true)}
    ${panel('led', '03', '16-Year Ledger', 'Investment plan', '', ledBody, 'Open the Ledger', true)}

/* panels arrive as their world comes into view; the ring fills then */
let IO = null;

  function scrollPos(){
    if(!stops) return 0;
    const y = scrollY;
    if(y <= stops[0]) return 0;
    for(let i = 0; i < stops.length - 1; i++) if(y < stops[i + 1]) return i + (y - stops[i]) / Math.max(1, stops[i + 1] - stops[i]);
    return stops.length - 1;
  }
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const rail = () => document.querySelectorAll('.rail a');

  /* ---- pointer and tilt: a little parallax */
  const look = {x: 0, y: 0, tx: 0, ty: 0};
  addEventListener('pointermove', e => { look.tx = e.clientX / innerWidth - .5; look.ty = e.clientY / innerHeight - .5; }, {passive: true});

  function resize(){
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w / h < .8 ? 58 : 45; camera.updateProjectionMatrix();
  }
  addEventListener('resize', layout);
  resize();

  /* ---- the opening: the core ignites, the cross draws itself, then a beam reaches out to light each world */
  const T0 = performance.now();
  const at = t => CALM ? 1 : t;
  let thinking = 0, thinkWant = 0, lastActive = -1;
  const clock = new THREE.Clock();

  function frame(){
    const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime, since = QUICK ? 99 : (performance.now() - T0) / 1000;
    const s = scrollPos(), i0 = Math.floor(s), i1 = Math.min(SCENES.length - 1, i0 + 1), f = ease(s - i0);
    const focusIdx = s - i0 < .5 ? i0 : i1;
    const heroness = Math.max(0, 1 - s);                 // 1 at the top, 0 once you leave the overview
    spin += dt * (CALM ? 0 : .05 + .05 * heroness) * (1 - .85 * Math.min(1, Math.abs(s - Math.round(s)) < .35 && Math.round(s) > 0 && Math.round(s) < 5 ? 1 : 0));
    worlds.forEach(w => place(w, t));

    /* camera */
    pose(SCENES[i0], A); pose(SCENES[i1], B);
    want.pos.lerpVectors(A.pos, B.pos, f); want.look.lerpVectors(A.look, B.look, f); want.off.lerpVectors(A.off, B.off, f);
    if(i0 !== i1 && (i0 > 0 && i1 < 5)){                 // between two worlds: swing out a little, so the move reads as a flight
      const arc = Math.sin(f * Math.PI); want.pos.multiplyScalar(1 + .28 * arc); want.pos.y += 1.8 * arc;
    }
    look.x += (look.tx - look.x) * .05; look.y += (look.ty - look.y) * .05;
    want.pos.x += look.x * 1.2; want.pos.y -= look.y * .8;
    const k = first ? 1 : 1 - Math.exp(-dt * 3.2); first = false;
    cur.pos.lerp(want.pos, k); cur.look.lerp(want.look, k); cur.off.lerp(want.off, k);
    camera.position.copy(cur.pos); camera.lookAt(cur.look);
    const w = innerWidth, h = innerHeight;
    camera.setViewOffset(w, h, cur.off.x * w, cur.off.y * h, w, h);

    /* core */
    const ign = Math.min(1, since / at(1.3)), pop = ign < 1 ? 1 - Math.pow(1 - ign, 3) * Math.cos(ign * 5) : 1;
    thinking += (thinkWant - thinking) * .06;
    const beat = Math.pow(Math.max(0, Math.sin(t * 2.2)), 12);
    heartMat.uniforms.uTime.value = t * (1 + thinking * 2.5); heartMat.uniforms.uPulse.value = beat * .6 + thinking;
    core.scale.setScalar(Math.max(.001, pop) * (1 + beat * .035 + thinking * .08));
    heart.rotation.y += dt * (.06 + thinking * .3);
    corona.quaternion.copy(camera.quaternion);
    coronaMat.uniforms.uTime.value = t * (1 + thinking * 2); coronaMat.uniforms.uPulse.value = beat * .5 + thinking; coronaMat.uniforms.uIgn.value = ign;
    windMat.uniforms.uTime.value = t; windMat.uniforms.uSpeed.value = 1 + thinking * 2.5; wind.visible = ign > .5;
    rings.forEach((g, j) => { g.rotation.y += dt * (.25 + j * .12) * (j % 2 ? -1 : 1) * (1 + thinking * 3);
      const b = g.userData.bead, a = t * (.8 + j * .3); b.position.set(Math.cos(a) * g.userData.r, 0, Math.sin(a) * g.userData.r); });
    halo.material.opacity = (.22 + beat * .15 + thinking * .25) * ign; halo.scale.setScalar(12 + beat * 1.5 + thinking * 3);
    sun.intensity = 60 * ign + beat * 15 + thinking * 40;

    /* the cross */
    crossLines.forEach((l, j) => { const p = Math.min(1, Math.max(0, (since - at(.7 + j * .14)) / at(.6))); l.material.opacity = .22 * p * (.8 + .2 * Math.sin(t + j)); });
    cross.children.forEach(c => { if(c.isSprite){ c.material.opacity = Math.min(1, since / at(1.4)) * (.6 + .4 * Math.sin(t * 1.3 + c.userData.tw)); } });
    cross.rotation.z = Math.sin(t * .05) * .03;

    /* the worlds and their beams */
    let flareAmt = 0;
    worlds.forEach(wd => {
      const start = at(1.5 + wd.i * .45), reach = Math.min(1, Math.max(0, (since - start) / at(.7)));   // the beam travels out
      const lit = since > start + at(.7);
      wd.power += ((lit ? (wd.live ? 1 : .45) : 0) - wd.power) * .08;
      const focused = SCENES[focusIdx] === wd.k ? 1 : hovered === wd.k ? .6 : 0;
      wd.focus += (focused - wd.focus) * .08;
      if(lit && since < start + at(1.1)) flareAmt = Math.max(flareAmt, 1 - (since - start - at(.7)) / at(.4));
      // beam: from the core's surface, up over the plane, down into the world
      V.copy(wd.pos).normalize().multiplyScalar(1.3);
      V2.copy(wd.pos).multiplyScalar(.5); V2.y += 1.6 + .4 * Math.sin(t * .4 + wd.i);
      wd.curve.v0.copy(V); wd.curve.v1.copy(V2); wd.curve.v2.copy(wd.pos).lerp(V, .12);
      const lp = wd.line.geometry.attributes.position, n = lp.count;
      for(let j = 0; j < n; j++){ wd.curve.getPoint(j / (n - 1) * reach, V); lp.setXYZ(j, V.x, V.y, V.z); }
      lp.needsUpdate = true;
      wd.line.material.opacity = (.16 + .3 * wd.focus + .12 * heroness) * Math.min(1, reach * 2);
      const pa = wd.packets.geometry.attributes.position, speed = .18 + .3 * wd.focus + thinking * .5;
      for(let j = 0; j < pa.count; j++){ const u = ((wd.phase[j] + t * speed) % 1) * reach; wd.curve.getPoint(u, V); pa.setXYZ(j, V.x, V.y, V.z); }
      pa.needsUpdate = true;
      wd.packets.material.uniforms.uOpacity.value = (.55 + .45 * wd.focus) * Math.min(1, reach * 1.5);
      wd.packets.material.uniforms.uSize.value = 7 + 4 * wd.focus;
      wd.packets.material.uniforms.uTime.value = t;
      // the world itself
      const pw = wd.power;
      wd.body.material.emissiveIntensity = .05 + pw * (.45 + .4 * wd.focus) + (wd.k === 'ats' ? beat * .2 * pw : 0);
      wd.body.rotation.y += dt * (.35 + wd.focus * .4); wd.body.rotation.x = Math.sin(t * .5 + wd.i) * .35;
      wd.cage.material.opacity = pw * (.12 + .3 * wd.focus); wd.cage.rotation.y -= dt * .2; wd.cage.rotation.z += dt * .07;
      wd.orbit.material.opacity = pw * (.25 + .4 * wd.focus); wd.orbit.rotation.z += dt * .3;
      const ma = t * 1.6 + wd.i; wd.moon.position.set(Math.cos(ma) * 1.35, Math.sin(ma) * 1.35 * Math.sin(.5), Math.sin(ma) * 1.35 * Math.cos(.5));
      wd.moon.material.opacity = pw;
      wd.aura.material.opacity = pw * (.35 + .4 * wd.focus); wd.aura.scale.setScalar(3.2 + wd.focus * 1.4 + Math.sin(t * 2 + wd.i) * .15);
      wd.g.scale.setScalar((.001 + .999 * Math.min(1, pw * 1.6)) * (1 + .12 * wd.focus));
    });
    flare.material.opacity = Math.max(0, flareAmt) * .8; flare.scale.setScalar(5 + 4 * flareAmt);

    sky.rotation.y += dt * .004; sky.material.uniforms.uTime.value = t;
    dust.rotation.y += dt * .02; dust.material.uniforms.uTime.value = t;

    renderer.render(scene, camera);

    /* labels, pinned to their worlds; shown in the overview */
    const tagVis = Math.max(0, 1 - s * 1.6);
    { const h = tagVis > .02 && document.querySelector('.hero'); heroBox = h ? h.getBoundingClientRect() : null; }
    worlds.forEach(wd => pin(wd.tag, V.copy(wd.pos).add(new THREE.Vector3(0, 1.25, 0)), tagVis * Math.min(1, wd.power * 1.5)));
    pin(coreTag, V.set(0, 2.2, 0), Math.min(1, since / at(1.6)) * Math.max(tagVis, s > 4.4 ? Math.min(1, (s - 4.4) * 2) : 0));

    /* the rail */
    const on = SCENES[Math.round(s)];
    if(Math.round(s) !== lastActive){ lastActive = Math.round(s); rail().forEach(a => a.classList.toggle('on', a.dataset.k === on)); }
    requestAnimationFrame(frame);
  }
  let heroBox = null;
  function pin(el, p, o){
    p.project(camera);
    const x = (p.x + 1) / 2 * innerWidth, y = (1 - p.y) / 2 * innerHeight;
    if(heroBox && x > heroBox.left - 70 && x < heroBox.right + 70 && y > heroBox.top - 10 && y < heroBox.bottom + 40) o = 0;   // never over the words or the tiles
    if(p.z > 1 || o < .02){ el.style.opacity = 0; el.style.pointerEvents = 'none'; return; }
    el.style.opacity = o.toFixed(3); el.style.pointerEvents = o > .2 ? 'auto' : 'none';
    el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
  }
  requestAnimationFrame(frame);

  return {
    setApps(info){ worlds.forEach(w => { const x = info[w.k]; w.live = !x || x.on !== false; w.note.textContent = x && x.note ? x.note : ''; w.tag.style.display = x ? '' : 'none'; }); coreTag.style.display = Object.keys(info).length ? '' : 'none'; },
    layout(){ requestAnimationFrame(layout); },
    think(on){ thinkWant = on ? 1 : 0; },
    go,
  };
})();

try{ const t = localStorage.getItem('ledger-theme'); if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; }catch(e){}
if(signedIn()) render(); else showLogin();
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && signedIn() && !$('lf')) render(); });
</script>
</body>
